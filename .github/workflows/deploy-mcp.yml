# Deploys the remote MCP server (worker/) to Cloudflare whenever the worker
# code or the published corpus changes on main.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - API token with the "Workers Scripts: Edit" permission
#                            (add "Workers KV Storage: Edit" if using the feedback queue)
#   CLOUDFLARE_ACCOUNT_ID  - from the Cloudflare dashboard's Workers overview page
#
# With the secrets absent the workflow skips cleanly instead of failing, so
# forks and pre-setup clones stay green.
name: Deploy MCP worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "rules/**"
      - "extracted/**"
      - "games.json"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cloudflare credentials
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not configured; skipping deploy."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install
        if: steps.check.outputs.deploy == 'true'
        run: npm ci

      - name: Test and typecheck
        if: steps.check.outputs.deploy == 'true'
        run: npm test && npm run typecheck

      - name: Stage corpus assets
        if: steps.check.outputs.deploy == 'true'
        run: npm run stage

      - name: Deploy
        if: steps.check.outputs.deploy == 'true'
        run: npx wrangler deploy
